[project]
name = "rockbase-seo"
version = "0.1.0"
description = "RockBase local Crawlee SEO worker"
requires-python = ">=3.12,<3.15"
dependencies = ["crawlee>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "defusedxml>=0.7,<1", "playwright>=1.50,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
